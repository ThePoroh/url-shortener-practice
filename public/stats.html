<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkPulse — Детальна статистика</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container { width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    .nav-back { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; }
    .nav-back:hover { color: #fff; }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    .link-meta { display: flex; flex-direction: column; gap: 6px; }
    .link-meta h2 { font-size: 18px; color: #818cf8; word-break: break-all; }
    .meta-sub { font-size: 13px; color: var(--text-muted); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .stat-val { font-size: 24px; font-weight: 700; color: #fff; }

    .charts-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } }

    .chart-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      height: 290px;
      display: flex;
      flex-direction: column;
    }
    .chart-box h3 { font-size: 14px; color: var(--text-muted); margin-bottom: 12px; }

    .table-container { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th { background: rgba(255, 255, 255, 0.02); padding: 12px 16px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; background: rgba(99, 102, 241, 0.15); color: #818cf8; text-transform: capitalize; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div style="font-weight: 700; font-size: 18px;">⚡ LinkPulse Stats</div>
    <a href="/" class="nav-back">← На головну</a>
  </header>

  <!-- Метадані лінка -->
  <div class="card link-meta">
    <h2 id="targetUrl">Завантаження...</h2>
    <div class="meta-sub" id="shortUrlLabel"></div>
    <div class="meta-sub" id="createdAtLabel"></div>
  </div>

  <!-- Метрики -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Всього переходів</div>
      <div class="stat-val" id="totalClicks">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Головний пристрій</div>
      <div class="stat-val" id="topDevice">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Топ браузер</div>
      <div class="stat-val" id="topBrowser">—</div>
    </div>
  </div>

  <!-- Графіки -->
  <div class="charts-grid">
    <div class="chart-box">
      <h3>Активність за часом</h3>
      <div style="position: relative; flex: 1; min-height: 0;">
        <canvas id="timelineChart"></canvas>
      </div>
    </div>
    <div class="chart-box">
      <h3>Пристрої</h3>
      <div style="position: relative; flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center;">
        <canvas id="deviceChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Таблиця переходів -->
  <div class="card" style="padding: 0; overflow: hidden;">
    <div style="padding: 16px; font-size: 14px; font-weight: 600;">Останні переходи</div>
    <div class="table-container" style="border: none;">
      <table>
        <thead>
          <tr>
            <th>Час</th>
            <th>Пристрій</th>
            <th>ОС</th>
            <th>Браузер</th>
          </tr>
        </thead>
        <tbody id="clicksTableBody">
          <tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 20px;">Дані завантажуються...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');

  if (!code) {
    window.location.href = '/';
  }

  let timelineChartInstance = null;
  let deviceChartInstance = null;

  async function loadDetailedStats() {
    try {
      const res = await fetch(`/api/links/${code}/stats?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error('Посилання не знайдено');
      const data = await res.json();

      document.getElementById('targetUrl').innerText = data.originalUrl;
      document.getElementById('shortUrlLabel').innerText = `Коротке посилання: ${window.location.origin}/go/${data.code}`;
      document.getElementById('createdAtLabel').innerText = `Створено: ${new Date(data.createdAt).toLocaleString('uk-UA')}`;
      
      document.getElementById('totalClicks').innerText = data.totalClicks;
      document.getElementById('topDevice').innerText = data.topDevice;
      document.getElementById('topBrowser').innerText = data.topBrowser;

      const tbody = document.getElementById('clicksTableBody');
      if (!data.recentClicks || data.recentClicks.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 20px;">Переходів ще не зафіксовано</td></tr>';
      } else {
        tbody.innerHTML = data.recentClicks.map(c => `
          <tr>
            <td>${new Date(c.createdAt || c.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</td>
            <td><span class="badge">${c.device || 'desktop'}</span></td>
            <td>${c.os || 'Unknown OS'}</td>
            <td>${c.browser || 'Unknown Browser'}</td>
          </tr>
        `).join('');
      }

      renderCharts(data);

    } catch (err) {
      console.error(err);
    }
  }

  function renderCharts(data) {
    // 1. Лінійний графік
    const timeLabels = Object.keys(data.timeline || {});
    const timeValues = Object.values(data.timeline || {});

    const ctxTime = document.getElementById('timelineChart').getContext('2d');
    if (timelineChartInstance) timelineChartInstance.destroy();
    
    timelineChartInstance = new Chart(ctxTime, {
      type: 'line',
      data: {
        labels: timeLabels.length ? timeLabels : ['Немає даних'],
        datasets: [{
          label: 'Кліки',
          data: timeValues.length ? timeValues : [0],
          borderColor: '#6366f1',
          backgroundColor: 'rgba(99, 102, 241, 0.2)',
          fill: true,
          tension: 0.35
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#9ca3af' } },
          y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { stepSize: 1, color: '#9ca3af' } }
        }
      }
    });

    // 2. Кругова діаграма
    const deviceLabels = Object.keys(data.devices || {});
    const deviceValues = Object.values(data.devices || {});

    const ctxDev = document.getElementById('deviceChart').getContext('2d');
    if (deviceChartInstance) deviceChartInstance.destroy();

    deviceChartInstance = new Chart(ctxDev, {
      type: 'doughnut',
      data: {
        labels: deviceLabels.length ? deviceLabels : ['Немає даних'],
        datasets: [{
          data: deviceValues.length ? deviceValues : [1],
          backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ec4899'],
          borderWidth: 2,
          borderColor: '#111827'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              color: '#9ca3af',
              font: { size: 11 },
              boxWidth: 10,
              padding: 10
            }
          }
        },
        cutout: '70%'
      }
    });
  }

  loadDetailedStats();
  setInterval(loadDetailedStats, 4000);
</script>

</body>
</html>
